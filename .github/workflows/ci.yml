name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Native module builds aren't needed for lint/typecheck/tests
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
