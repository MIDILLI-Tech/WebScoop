name: Release

# Two ways to cut a release:
#
#   1) Manual (recommended): run this workflow from the Actions tab and type a
#      version (e.g. "0.50.0" or "v0.50.0"). It bumps package.json +
#      package-lock.json, commits, creates & pushes the git tag, then builds
#      Windows / macOS / Linux installers and publishes a GitHub Release.
#
#   2) Just push a tag yourself (e.g. `git tag v0.50.0 && git push origin v0.50.0`).
#      The build + release jobs run for that tag.
#
# NOTE: a push performed with the default GITHUB_TOKEN does NOT trigger other
# workflows, so we intentionally keep bump + build + release in this one file.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.50.0). A leading "v" is optional.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Required to push the tag/commit and to create the Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1) Manual trigger only: bump the version files, commit and tag.
  # ------------------------------------------------------------------
  tag:
    name: Bump version & tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compute / validate version
        id: meta
        run: |
          VERSION='${{ inputs.version }}'
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected something like 0.50.0"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"

      # Updates BOTH package.json and package-lock.json, without making a
      # commit/tag (we do that ourselves right after).
      - name: Bump package.json & package-lock.json
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Generate changelog
        run: npm run changelog -- --version="${{ steps.meta.outputs.version }}"

      # Guard against a silently lost bump (a concurrent push/merge used to
      # reset package.json to the previous version while the tag moved on).
      - name: Verify bumped version
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          EXPECTED='${{ steps.meta.outputs.version }}'
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version is '$ACTUAL' but expected '$EXPECTED'"
            exit 1
          fi
          echo "package.json version: $ACTUAL"

      - name: Commit, tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md README.md
          git commit -m "chore(release): ${{ steps.meta.outputs.tag }} [skip ci]" \
            || echo "Nothing to commit"

          BRANCH='${{ github.ref_name }}'
          TAG='${{ steps.meta.outputs.tag }}'

          # Rebase on the latest branch tip and retry: a plain push could be
          # rejected, and resolving that merge by hand reverted the version
          # bump once. The tag is only created after the commit is on the
          # remote, so it always points at the released version.
          for attempt in 1 2 3; do
            git fetch origin
            git rebase --autostash "origin/$BRANCH" || {
              echo "::error::Rebase onto origin/$BRANCH failed"
              exit 1
            }
            if git push origin "HEAD:$BRANCH"; then
              git tag -f "$TAG"
              if git push -f origin "$TAG"; then
                echo "Pushed release commit and $TAG (attempt $attempt)"
                exit 0
              fi
              echo "::error::Could not push tag $TAG"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) - retrying"
          done
          echo "::error::Could not push release commit after 3 attempts"
          exit 1

  # ------------------------------------------------------------------
  # 2) Build installers for every OS and collect them as artifacts.
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    needs: tag
    # Run when the tag job succeeded (manual run) OR was skipped (tag push).
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win
          - name: linux-x64
            os: ubuntu-latest
            args: --linux
          # Intel (x64) + Apple Silicon (arm64) in a SINGLE invocation so that
          # electron-builder merges both macOS zips into one latest-mac.yml
          # (two separate runs would overwrite each other's update metadata).
          # --config.npmRebuild=true rebuilds better-sqlite3 for each target
          # arch; the repo default is npmRebuild:false to keep local builds fast.
          - name: macos-x64-arm64
            os: macos-latest
            args: --mac --x64 --arm64 --config.npmRebuild=true
    runs-on: ${{ matrix.os }}
    env:
      # No Apple certificate -> electron-builder ad-hoc signs macOS builds
      # (mac.identity: "-"); don't auto-discover any accidental identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          # manual run -> build the freshly created tag; tag push -> github.ref
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # Fail fast if the tag and package.json disagree: electron-builder takes
      # the installer/update metadata version from package.json, so a mismatch
      # publishes artifacts under the wrong version.
      - name: Verify package.json matches the release tag
        run: |
          TAG='${{ needs.tag.outputs.tag || github.ref_name }}'
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version is '$ACTUAL' but the tag is '$TAG'"
            exit 1
          fi
          echo "Releasing $ACTUAL"

      # Full install (no --ignore-scripts) so the postinstall step
      # (`electron-builder install-app-deps`) rebuilds native modules
      # (better-sqlite3) against the current Electron version.
      - name: Install dependencies
        run: npm ci

      - name: Build app (electron-vite)
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  # ------------------------------------------------------------------
  # 3) Create a single GitHub Release with all platform assets.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [tag, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          try:
              text = open('CHANGELOG.md').read()
          except FileNotFoundError:
              text = ''
          pattern = rf'^## \[{re.escape(version)}\].*?(?=^## \[|\Z)'
          m = re.search(pattern, text, re.M | re.S)
          notes = m.group(0).strip() if m else f"Release v{version}"
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          PY

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "WebScoop ${TAG}" \
              --notes-file release-notes.md
          fi
